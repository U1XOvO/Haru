name: Build and release Haru

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
          - os: macos-15
            target: macos-arm64
          - os: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
      PYINSTALLER_CONFIG_DIR: ${{ github.workspace }}/.cache/pyinstaller
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Windows build environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/uv.ps1 sync --locked --group build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          'PYTHON_BIN=./.venv/Scripts/python.exe' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Prepare macOS build environment
        if: runner.os == 'macOS'
        run: |
          bash scripts/uv.sh sync --locked --group build
          echo 'PYTHON_BIN=./.venv/bin/python' >> "$GITHUB_ENV"
      - name: Check release tag against project version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: '"$PYTHON_BIN" scripts/build_release.py verify-tag'
      - name: Run offline unit tests
        shell: bash
        run: '"$PYTHON_BIN" -B -m unittest discover -s tests -v'
      - name: Build standalone app
        shell: bash
        run: '"$PYTHON_BIN" -B scripts/build_release.py build'
      - name: Test relocated Windows app
        if: runner.os == 'Windows'
        shell: bash
        run: '"$PYTHON_BIN" -B scripts/test_windows_bundle.py'
      - name: Test relocated macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: '"$PYTHON_BIN" -B scripts/test_macos_bundle.py'
      - name: Create release archive
        shell: bash
        run: '"$PYTHON_BIN" -B scripts/build_release.py package'
      - uses: actions/upload-artifact@v4
        with:
          name: Haru-${{ matrix.target }}
          path: dist/releases/Haru-*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create draft GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: Haru-*
          path: release-assets
          merge-multiple: true
      - name: Upload verified packages to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(find release-assets -maxdepth 1 -name 'Haru-*.zip' | wc -l)" -eq 3
          if gh release view "$RELEASE_TAG" --json isDraft > release-status.json 2>/dev/null; then
            test "$(jq -r .isDraft release-status.json)" = true || { echo 'Refusing to overwrite a published release.'; exit 1; }
            gh release upload "$RELEASE_TAG" release-assets/*.zip --clobber
          else
            gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --draft \
              --title "Haru $RELEASE_TAG" --notes-file RELEASE_NOTES.md
          fi
