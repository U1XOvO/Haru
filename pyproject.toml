[project]
name = "haru-japanese"
version = "1.3.2"
description = "A macOS and Windows Japanese learning app for Chinese speakers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "edge-tts>=7.2.8",
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "portalocker>=3,<4",
    "pywebview>=6,<7 ; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
build = [
    "cryptography>=46,<49",
    "pyinstaller>=6.16,<7",
    "pillow>=11,<13 ; sys_platform == 'win32'",
]
