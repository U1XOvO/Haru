description = "A macOS and Windows Japanese learning app for Chinese speakers"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28,<1",
    "openai>=2,<3",
    "portalocker>=3,<4",
    "python-dotenv>=1,<2",
    "pywebview>=6,<7 ; sys_platform == 'win32'",
]

[tool.uv]
package = false
